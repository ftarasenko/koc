name: release-dryrun

# The release path up to, and not including, publishing. It holds no secret, no
# environment and no write grant, so it can run on any branch or fork.
#
#   gh workflow run release-dryrun.yml --ref master -f tag=vX.Y.Z   # a tag you plan to push
#   gh workflow run release-dryrun.yml --ref master                 # tip of master, no tag
#
# 1. gate: the same scripts/release-gate.sh the release runs. It stops on a tag
#    that is not annotated, on a commit that is not on the mainline and on red or
#    missing CI on that SHA. With no `tag`, it gates the commit the run was started
#    on, so a dispatch from a feature branch must stop.
# 2. selftest: the gate script's tests, from this workflow's own ref.
# 3. package: the tag's source (not this ref's), built with pinned Go, cosign,
#    syft and GoReleaser, `release --snapshot` with publish and signing skipped: the six binaries, archives, packages, the
#    SBOM bundle and the checksums are built, nothing is uploaded.
#
# A pull request that touches the release files runs selftest and package, not
# gate (a pull request has no tag to gate), so a broken pin or config fails before
# the tag is burned.
on:
  workflow_dispatch:
    inputs:
      tag:
        description: "Release tag to gate (vX.Y.Z); empty gates the commit this run is on"
        required: false
        default: ""
  pull_request:
    paths:
      - ".github/workflows/release.yml"
      - ".github/workflows/release-dryrun.yml"
      - ".goreleaser.yaml"
      - "scripts/release-*.sh"
      - "scripts/sbom-bundle.sh"
      - "test/release/**"

permissions: {}

# Same pins as release.yml; test/release/gate_test.sh compares the two.
env:
  GO_VERSION: "1.27.4"
  GORELEASER_VERSION: "v2.20.1"
  COSIGN_VERSION: "v3.1.4"
  SYFT_VERSION: "v1.54.0"
  GOFLAGS: -mod=vendor
  GOPROXY: "off"
  CGO_ENABLED: "0"

jobs:
  gate:
    if: github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      checks: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Release gate
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ inputs.tag }}
          SHA: ${{ github.sha }}
          GITHUB_RUN_ID: ${{ github.run_id }}
          RELEASE_BRANCH: ${{ github.event.repository.default_branch }}
          # A dry run starts when the maintainer is about to tag, so a check that
          # is still running is waited for only briefly.
          GATE_WAIT_SECONDS: "120"
        run: |
          if [ -n "$TAG" ]; then scripts/release-gate.sh "$TAG"; else scripts/release-gate.sh --sha "$SHA"; fi

  # The gate scripts and their tests come from the ref this workflow runs on, never
  # from the tag being rehearsed: an older tag predates them.
  selftest:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Release gate script tests
        run: test/release/gate_test.sh

  package:
    needs: [gate, selftest]
    # Run after the gate passed, or alone on a pull request (where gate is skipped).
    if: ${{ !cancelled() && needs.selftest.result == 'success' && (needs.gate.result == 'success' || needs.gate.result == 'skipped') }}
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          ref: ${{ inputs.tag != '' && format('refs/tags/{0}', inputs.tag) || '' }}

      # The rehearsed tag is what gets built; the helper scripts come from this
      # workflow's own ref, in a directory git ignores so the tree stays clean.
      - name: Fetch release helper scripts from the workflow ref
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          path: .dryrun-tools
          persist-credentials: false

      - name: Keep helper scripts out of the build tree
        run: echo "/.dryrun-tools/" >> .git/info/exclude

      - name: Set up Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: ${{ env.GO_VERSION }}
          check-latest: false
          cache: false

      - name: Generate shell completions
        run: make completions

      - name: Install cosign
        uses: sigstore/cosign-installer@756fe2d284c7292c4e9b62c8a28f1e5629c59532 # v4.1.3
        with:
          cosign-release: ${{ env.COSIGN_VERSION }}

      - name: Install syft
        uses: anchore/sbom-action/download-syft@66cbf4bc1f1c0d2edc94016e65bc221b6bb0ad6c # v0.24.3
        with:
          syft-version: ${{ env.SYFT_VERSION }}

      - name: Build inputs
        env:
          TAG: ${{ inputs.tag || 'v0.0.0-dryrun' }}
        run: .dryrun-tools/scripts/release-inputs.sh "$TAG" | tee -a "$GITHUB_STEP_SUMMARY"

      # --snapshot: no tag required, nothing published. The cask block reads a
      # token from the environment only to render; it is never used here.
      - name: GoReleaser (snapshot, publish and sign skipped)
        uses: goreleaser/goreleaser-action@a4f02ab5355a589de60d917a659ce617ed19b3de # v7.3.0
        with:
          version: ${{ env.GORELEASER_VERSION }}
          args: release --clean --snapshot --skip=publish,sign
        env:
          HOMEBREW_TAP_TOKEN: not-a-token

      - name: List what would be released
        run: ls -1 dist | grep -E '\.(tar\.gz|zip|rpm|deb)$|checksums\.txt' | sort
